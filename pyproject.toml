[project]
name = "ai-translate"
version = "0.1.0"
description = "Document translation tool with format preservation"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[project.scripts]
ai-translate = "src.app:run"
